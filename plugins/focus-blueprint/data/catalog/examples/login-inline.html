<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="blueprint:screen" content="login-inline">
<title>התחברות בדף הבית</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#1a1a1a;background:#fff}
a,button,input,select{font:inherit}
a,button{min-height:44px;min-width:44px}
a{color:#0b3d91}
label{display:block;font-size:14px;margin-bottom:4px}
input,select{display:block;width:100%;min-height:44px;padding:6px 10px}
ul{list-style:none;margin:0;padding:0}
h1{font-size:22px;margin:0 0 4px}
p{margin:0 0 12px}
:focus-visible{outline:3px solid #0b3d91;outline-offset:2px}
button:hover,a:hover{filter:brightness(.92)}
button:active{filter:brightness(.85)}
[data-primary]{background:#0b3d91;color:#fff;border:0;border-radius:6px;padding:8px 24px}
input{border:1px solid #8a8a8a;border-radius:4px}
body{background:#fff}
header{display:flex;justify-content:space-between;align-items:center;padding:0 16px;background:#f1f3f8;border-bottom:1px solid #c9cfdd}
main{max-width:460px;margin:0 auto;padding:16px}
.panel{background:#f6f7fb;border:1px solid #c9cfdd;border-radius:10px;padding:16px;margin-top:16px}
.row{display:flex;gap:10px;align-items:flex-end}
.row>div{flex:1}
</style>
</head>
<body>
<header><a data-anchor href="#">בית</a><a href="#">הגדרות</a></header>
<main>
<h1>המסמכים של הלקוחות שלכם</h1>
<p>העלאה, חיפוש וחודש נוכחי, הכול במקום אחד. כדי לראות את הקבלות של נובמבר, נכנסים כאן, בלי לעבור לדף אחר.</p>
<form class="panel" onsubmit="return false">
<div class="row"><div><label for="e">אימייל</label><input id="e" type="email"></div><div><label for="p">סיסמה</label><input id="p" type="password"></div></div>
<p style="margin:14px 0 0"><button type="submit" data-primary>כניסה</button> <span data-loading hidden>נכנס</span></p>
</form>
</main>
</body>
</html>
