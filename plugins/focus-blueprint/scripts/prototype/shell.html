<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>{{TOKENS}}</style>
<style>{{CSS}}</style>
</head>
<body>
<div class="bp-pill" id="bp-pill" role="toolbar" dir="rtl">
  <span class="bp-label" id="bp-label"></span>
  <span class="bp-badge" id="bp-badge"></span>
  <button type="button" id="bp-map-btn"></button>
  <button type="button" id="bp-note-btn" hidden></button>
  <span class="bp-device" id="bp-device" role="group">
    <button type="button" id="bp-phone" aria-pressed="false"></button>
    <button type="button" id="bp-computer" aria-pressed="false"></button>
  </span>
  <button type="button" id="bp-fs-btn" aria-pressed="false" hidden></button>
</div>
<section class="bp-notes" id="bp-notes" role="dialog" aria-labelledby="bp-notes-title" dir="rtl" hidden>
  <h2 id="bp-notes-title"></h2>
  <label for="bp-notes-text" id="bp-notes-label"></label>
  <textarea id="bp-notes-text" rows="3" maxlength="2000"></textarea>
  <div class="bp-notes-actions"><button type="button" id="bp-notes-save"></button><button type="button" id="bp-notes-copy" hidden></button><button type="button" id="bp-notes-close"></button></div>
  <p class="bp-notes-status" id="bp-notes-status" role="status" aria-live="polite"></p>
  <h3 id="bp-notes-earlier-title"></h3>
  <ul id="bp-notes-list"></ul>
</section>
<div class="bp-cover" id="bp-cover" hidden></div>
<main class="bp-stage" id="bp-stage" data-device="computer">
  <div class="bp-frame-wrap" id="bp-frame-wrap"><iframe id="bp-frame"></iframe></div>
  <section class="bp-placeholder" id="bp-placeholder" hidden>
    <h2 id="bp-ph-title"></h2>
    <p id="bp-ph-text"></p>
    <button type="button" id="bp-ph-back"></button>
  </section>
</main>
<dialog class="bp-dialog" id="bp-dialog" aria-labelledby="bp-dialog-title">
  <div class="bp-dialog-head"><h2 id="bp-dialog-title"></h2><button type="button" id="bp-dialog-close"></button></div>
  <p class="bp-counter" id="bp-counter"></p>
  <div id="bp-groups"></div>
</dialog>
<div class="bp-toast" id="bp-toast" role="status" aria-live="polite"></div>
<script type="application/json" id="bp-screens">{{SCREENS}}</script>
<script type="application/json" id="bp-data">{{DATA}}</script>
<script>{{BOOT}}</script>
<script>{{JS}}</script>
</body>
</html>
