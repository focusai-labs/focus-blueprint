name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The LTS lines on https://nodejs.org/en/about/previous-releases (Node 20 is end of life).
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Git identity for the tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - run: node --test "test/**/*.test.mjs"
