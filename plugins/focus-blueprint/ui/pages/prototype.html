<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Focus Blueprint</title>
<script>try{if(localStorage.getItem('bp-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="prototype.css">
</head>
<body data-page="prototype" data-title="prototype.title">
<header class="appbar" id="appbar"><span id="save" class="save" role="status" aria-live="polite"></span></header>
<main class="proto">
<header class="proto-head">
  <h1 data-t="prototype.title"></h1>
  <span class="badge neutral" id="round" hidden></span>
  <p class="muted proto-intro" data-t="prototype.intro"></p>
</header>
<p id="missing" class="note" hidden role="status" data-t="prototype.missing"></p>
<div class="proto-body" id="body" hidden></div>
<p id="fatal" class="note" hidden role="alert"></p>
</main>
<script src="ui.js" defer></script>
<script src="prototype.js" defer></script>
</body>
</html>
