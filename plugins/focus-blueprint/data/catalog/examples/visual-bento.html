<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="blueprint:screen" content="visual-bento">
<title>אריחים</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#1a1a1a;background:#fff}
a,button,input,select{font:inherit}
a,button{min-height:44px;min-width:44px}
a{color:#0b3d91}
label{display:block;font-size:14px;margin-bottom:4px}
input,select{display:block;width:100%;min-height:44px;padding:6px 10px}
ul{list-style:none;margin:0;padding:0}
h1{font-size:22px;margin:0 0 4px}
p{margin:0 0 12px}
:focus-visible{outline:3px solid #0b3d91;outline-offset:2px}
button:hover,a:hover{filter:brightness(.92)}
button:active{filter:brightness(.85)}
.wrap{max-width:420px;margin:0 auto;padding:16px}
body{background:#f1efe9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.t{border-radius:18px;padding:14px;background:#fff}
.t b{display:block;font-size:30px}
.a{background:#dce6ff}.b{background:#ffe3c9}.w{grid-column:1/-1}
.list li{display:flex;justify-content:space-between;padding:8px 0}
[data-primary]{width:100%;background:#0b3d91;color:#fff;border:0;border-radius:18px;padding:8px 24px}
</style>
</head>
<body>
<main class="wrap">
<p><a data-anchor href="#">לדף הבית</a></p>
<div class="grid">
<div class="t w"><h1>מסמכים</h1><span>הקבלות של נובמבר</span></div>
<div class="t a"><b>24</b>מסמכים</div>
<div class="t b"><b>8</b>לקוחות</div>
<div class="t w"><label for="q">חיפוש לקוח</label><input id="q" type="search"></div>
<ul class="t w list"><li><span>לקוח א</span><span>קבלה 1041</span></li><li><span>לקוח ב</span><span>קבלה 1042</span></li><li><span>לקוח ג</span><span>קבלה 1043</span></li></ul>
<div class="w"><button type="button" data-primary>העלאה</button></div>
</div>
</main>
</body>
</html>
