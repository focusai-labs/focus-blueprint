<!doctype html>

<title>דף אחד</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#1a1a1a;background:#fff}
a,button,input,select{font:inherit}

p{margin:0 0 12px}

button:hover,a:hover{filter:brightness(.92)}
button:active{filter:brightness(.85)}
main{max-width:420px;margin:0 auto;padding:16px}
section{padding:14px 0;border-bottom:1px solid #d8d8d8}
h2{font-size:18px;margin:0 0 8px}
.list li{display:flex;justify-content:space-between;padding:6px 0}

<body>

<p style="margin-top:16px"><button type="button" data-primary>העלאה</button></p>
