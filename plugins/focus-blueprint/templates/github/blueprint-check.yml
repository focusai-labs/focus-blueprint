name: blueprint-check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  # The ruleset on main requires a check with exactly this name (templates/github/ruleset-main.json).
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/blueprint-check.mjs
