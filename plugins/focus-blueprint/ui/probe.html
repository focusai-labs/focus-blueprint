<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיקת הממשק המקומי</title>
<style>
  :root { --bg:#fbfaff; --surface:#ffffff; --fg:#1d1a2b; --muted:#625d78; --line:#e3dff0; --accent:#5b3fd6; --ok:#18794e; --bad:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14121d; --surface:#1d1a29; --fg:#ece9f7; --muted:#a6a0bd; --line:#322d45; --accent:#a995ff; --ok:#5fd0a0; --bad:#ff8a80; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; font-size:17px; line-height:1.7; }
  main { max-width:620px; margin:0 auto; padding:56px 20px; display:flex; flex-direction:column; gap:18px; }
  h1 { margin:0; font-size:30px; line-height:1.25; }
  p { margin:0; color:var(--muted); }
  textarea { width:100%; min-height:120px; padding:12px 14px; font:inherit; color:inherit; background:var(--surface); border:1px solid var(--line); border-radius:10px; resize:vertical; }
  textarea:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { align-self:flex-start; font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:10px; padding:10px 26px; cursor:pointer; }
  @media (prefers-color-scheme: dark) { button { color:#14121d; } }
  button:disabled { opacity:.5; cursor:default; }
  #status { min-height:1.7em; font-weight:600; }
  #status.ok { color:var(--ok); }
  #status.bad { color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>הממשק המקומי עובד</h1>
  <p>הדף הזה רץ מהמחשב הזה בלבד. כאן כותבים משפט אחד ולוחצים על שמירה, ו-Claude קורא אותו מתיקיית הפרויקט.</p>
  <textarea id="answer" aria-label="המשפט לבדיקה" placeholder="משפט אחד, מה שעולה בראש"></textarea>
  <button id="save" type="button">שמירה</button>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script>
  const answer = document.getElementById('answer');
  const save = document.getElementById('save');
  const status = document.getElementById('status');
  save.addEventListener('click', async () => {
    const text = answer.value.trim();
    if (!text) {
      status.className = 'bad';
      status.textContent = 'קודם כותבים משפט, ואז שומרים.';
      answer.focus();
      return;
    }
    save.disabled = true;
    status.className = '';
    status.textContent = 'שומר...';
    try {
      const res = await fetch('api/answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: 'probe', answer: text }),
      });
      if (!res.ok) throw new Error(String(res.status));
      status.className = 'ok';
      status.textContent = 'נשמר. אפשר לחזור ל-Claude.';
    } catch {
      status.className = 'bad';
      status.textContent = 'השמירה לא הצליחה. אפשר לנסות שוב.';
      save.disabled = false;
    }
  });
</script>
</body>
</html>
