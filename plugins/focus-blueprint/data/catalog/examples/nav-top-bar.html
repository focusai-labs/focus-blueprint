<head>
<meta charset="utf-8">

<title>סרגל עליון</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#1a1a1a;background:#fff}
a,button,input,select{font:inherit}
a,button{min-height:44px;min-width:44px}
a{color:#0b3d91}
label{display:block;font-size:14px;margin-bottom:4px}
input,select{display:block;width:100%;min-height:44px;padding:6px 10px}
ul{list-style:none;margin:0;padding:0}
h1{font-size:22px;margin:0 0 4px}
p{margin:0 0 12px}
:focus-visible{outline:3px solid #0b3d91;outline-offset:2px}
button:hover,a:hover{filter:brightness(.92)}
button:active{filter:brightness(.85)}
.list li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #d8d8d8}
.list{margin-bottom:16px}
[data-primary]{background:#0b3d91;color:#fff;border:0;border-radius:6px;padding:8px 24px}
[aria-current]{font-weight:700}
nav a{display:flex;align-items:center;text-decoration:none;color:#1a1a1a}
main{padding:16px}
nav{background:#f1f3f8;border-bottom:1px solid #c9cfdd}
nav ul{display:flex;flex-wrap:wrap;gap:0 4px;padding:0 8px}
nav a{padding:0 10px;font-size:15px}
[aria-current]{box-shadow:inset 0 -4px #0b3d91}
</style>
</head>
<body>
<nav aria-label="ראשי"><ul><li><a data-anchor aria-current="page" href="#">מסמכים</a></li><li><a href="#">לקוחות</a></li><li><a href="#">העלאה</a></li><li><a href="#">הגדרות</a></li><li><a href="#">חודש נוכחי</a></li></ul></nav>

<ul class="list"><li><span>לקוח א</span><span>קבלה 1041</span></li><li><span>לקוח ב</span><span>קבלה 1042</span></li><li><span>לקוח ג</span><span>קבלה 1043</span></li></ul>
<button type="button" data-primary>הוספת מסמך</button></main>
