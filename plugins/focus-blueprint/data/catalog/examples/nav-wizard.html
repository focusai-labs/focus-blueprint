<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="blueprint:screen" content="nav-wizard">
<title>צעד אחרי צעד</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#1a1a1a;background:#fff}
a,button,input,select{font:inherit}
a,button{min-height:44px;min-width:44px}
a{color:#0b3d91}
label{display:block;font-size:14px;margin-bottom:4px}
input,select{display:block;width:100%;min-height:44px;padding:6px 10px}
ul{list-style:none;margin:0;padding:0}
h1{font-size:22px;margin:0 0 4px}
p{margin:0 0 12px}
:focus-visible{outline:3px solid #0b3d91;outline-offset:2px}
button:hover,a:hover{filter:brightness(.92)}
button:active{filter:brightness(.85)}
.list li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #d8d8d8}
.list{margin-bottom:16px}
[data-primary]{background:#0b3d91;color:#fff;border:0;border-radius:6px;padding:8px 24px}
[aria-current]{font-weight:700}
nav a{display:flex;align-items:center;text-decoration:none;color:#1a1a1a}
main{padding:16px}
.steps{display:flex;gap:4px;margin:0 0 20px;counter-reset:s}
.steps li{flex:1;text-align:center;font-size:12px;line-height:1.2;counter-increment:s}
.steps li::before{content:counter(s);display:block;width:32px;height:32px;line-height:32px;margin:0 auto 4px;border-radius:50%;background:#e4e7ef;color:#1a1a1a;font-size:15px}
.steps li[aria-current]::before{background:#0b3d91;color:#fff}
.steps li.done::before{background:#1f6b3a;color:#fff;content:"✓"}
.row{display:flex;gap:10px;margin-top:16px}
.row button{flex:1}
.back{background:#fff;color:#0b3d91;border:2px solid #0b3d91;border-radius:6px}
</style>
</head>
<body>
<main>
<p><a data-anchor href="#">לדף הבית</a></p>
<ol class="steps" aria-label="שלבים" style="padding:0;list-style:none">
<li class="done">מסמכים</li><li class="done">לקוחות</li><li aria-current="step">העלאה</li><li>הגדרות</li><li>חודש נוכחי</li>
</ol>
<h1>העלאה</h1>
<p>שלב 3 מתוך 5</p>
<label for="f">סוג מסמך</label><select id="f"><option>קבלה</option><option>חשבונית</option></select>
<div class="row"><button type="button" class="back">הקודם</button><button type="button" data-primary>הבא</button></div>
</main>
</body>
</html>
