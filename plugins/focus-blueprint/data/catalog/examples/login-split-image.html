<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="blueprint:screen" content="login-split-image">
<title>תמונה וטופס</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#1a1a1a;background:#fff}
a,button,input,select{font:inherit}
a,button{min-height:44px;min-width:44px}
a{color:#0b3d91}
label{display:block;font-size:14px;margin-bottom:4px}
input,select{display:block;width:100%;min-height:44px;padding:6px 10px}
ul{list-style:none;margin:0;padding:0}
h1{font-size:22px;margin:0 0 4px}
p{margin:0 0 12px}
:focus-visible{outline:3px solid #0b3d91;outline-offset:2px}
button:hover,a:hover{filter:brightness(.92)}
button:active{filter:brightness(.85)}
[data-primary]{background:#0b3d91;color:#fff;border:0;border-radius:6px;padding:8px 24px}
input{border:1px solid #8a8a8a;border-radius:4px}
body{min-height:100vh}
.split{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.art{background-color:#2a2a8a;background-image:linear-gradient(160deg,#0b3d91,#5b2a86);color:#fff;padding:24px;display:flex;flex-direction:column;justify-content:flex-end}
.art h2{font-size:26px;margin:0}
.side{padding:24px;align-self:center}
@media (max-width:600px){.split{grid-template-columns:1fr}.art{min-height:140px}.side{padding:16px}}
</style>
</head>
<body>
<div class="split">
<div class="art" aria-hidden="true"><h2>ברוכים הבאים</h2><span>מסמכים של הלקוחות במקום אחד</span></div>
<main class="side">
<p><a data-anchor href="#">לדף הבית</a></p>
<h1>כניסה</h1>
<label for="e">אימייל</label><input id="e" type="email" autocomplete="username">
<div style="height:12px"></div>
<label for="p">סיסמה</label><input id="p" type="password" autocomplete="current-password">
<p style="margin:16px 0 8px"><button type="button" data-primary style="width:100%">כניסה</button> <span data-loading hidden>נכנס</span></p>
<a href="#">שכחתי סיסמה</a>
</main>
</div>
</body>
</html>
